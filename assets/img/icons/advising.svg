<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER — Strategic Advising. Drawn for the prototype in the style of
     the four icons supplied by Fuse (Synthesis, Infographic, Facilitation,
     Education). To be replaced by the designers' version. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 201.76 226">
  <defs>
    <clipPath id="sa-disc"><circle cx="100.88" cy="113" r="100.88"/></clipPath>
  </defs>
  <circle cx="100.88" cy="113" r="100.88" fill="#417d39" opacity=".65"/>

  <!-- the roadmap sheet, tilted, overflowing the disc at the top -->
  <g transform="rotate(-7 100 90)">
    <rect x="34" y="8" width="126" height="150" rx="2" fill="#e8e8e8"/>
    <rect x="30" y="4" width="126" height="150" rx="2" fill="#fff"/>
    <rect x="42" y="16" width="70" height="7" fill="#abbf0f" opacity=".6"/>
    <rect x="42" y="28" width="44" height="4" fill="#417d39" opacity=".54"/>
    <!-- the winding path -->
    <path d="M52 138 C 52 112, 128 118, 128 94 S 58 76, 64 56 S 120 46, 132 40"
          fill="none" stroke="#c6c6c6" stroke-width="9" stroke-linecap="round"/>
    <path d="M52 138 C 52 112, 128 118, 128 94 S 58 76, 64 56 S 120 46, 132 40"
          fill="none" stroke="#417d39" stroke-width="2.4" stroke-dasharray="5 5" stroke-linecap="round"/>
    <!-- three milestones: people, structure, implementation -->
    <circle cx="56" cy="124" r="8" fill="#abbf0f"/>
    <circle cx="124" cy="100" r="8" fill="#417d39" opacity=".65"/>
    <circle cx="66" cy="62" r="8" fill="#417d39"/>
    <!-- the flag at the end -->
    <line x1="132" y1="40" x2="132" y2="16" stroke="#417d39" stroke-width="2.6"/>
    <path d="M133 16 L151 21 L133 27 Z" fill="#fa7f08"/>
  </g>

  <!-- the people around the table, clipped to the disc like the other icons -->
  <g clip-path="url(#sa-disc)">
    <g fill="#417d39">
      <circle cx="42" cy="158" r="16"/>
      <path d="M6 226 C 6 190, 20 176, 42 176 S 78 190, 78 226 Z"/>
      <circle cx="160" cy="160" r="15"/>
      <path d="M126 226 C 126 192, 140 178, 160 178 S 196 192, 196 226 Z"/>
    </g>
    <g>
      <path d="M62 226 C 62 186, 78 170, 101 170 S 140 186, 140 226 Z" fill="#417d39" opacity=".85"/>
      <circle cx="101" cy="150" r="16" fill="#dbb088"/>
      <path d="M85 150 c 0 -11 7 -18 16 -18 s 16 7 16 18 c -4 -6 -10 -8 -16 -8 s -12 2 -16 8 Z" fill="#417d39"/>
      <!-- the hand pointing at the map -->
      <path d="M128 190 C 134 178, 140 170, 148 162" fill="none" stroke="#417d39" stroke-width="11" stroke-linecap="round" opacity=".85"/>
      <circle cx="150" cy="159" r="6" fill="#dbb088"/>
    </g>
  </g>
</svg>
